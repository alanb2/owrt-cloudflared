name: Build and publish cloudflared

on:
  workflow_dispatch:
    inputs:
      cloudflared_version:
        description: "Versione cloudflared; vuoto = ultima release"
        required: false
        type: string
      openwrt_version:
        description: "Versione OpenWrt; vuoto = ultima stabile"
        required: false
        type: string
  workflow_call:
    inputs:
      cloudflared_version:
        required: true
        type: string
      openwrt_version:
        required: true
        type: string
    secrets:
      APK_SIGN_KEY:
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TARGET: "rockchip/armv8"
  PACKAGE_ARCH: "aarch64_generic"
  FEED_URL: "https://alanb2.github.io/owrt-cloudflared"

jobs:
  resolve-versions:
    runs-on: ubuntu-24.04
    outputs:
      cloudflared_version: ${{ steps.versions.outputs.cloudflared_version }}
      openwrt_version: ${{ steps.versions.outputs.openwrt_version }}
      should_build: ${{ steps.versions.outputs.should_build }}
      package_release: ${{ steps.versions.outputs.package_release }}
      packaging_hash: ${{ steps.versions.outputs.packaging_hash }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve cloudflared and OpenWrt versions
        id: versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CLOUDFLARED_VERSION: ${{ inputs.cloudflared_version }}
          INPUT_OPENWRT_VERSION: ${{ inputs.openwrt_version }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_CLOUDFLARED_VERSION" ]]; then
            CF_VERSION="$INPUT_CLOUDFLARED_VERSION"
          else
            CF_VERSION="$(
              gh api repos/cloudflare/cloudflared/releases/latest \
                --jq '.tag_name' \
                | sed 's/^v//'
            )"
          fi

          if [[ -n "$INPUT_OPENWRT_VERSION" ]]; then
            OPENWRT_VERSION="$INPUT_OPENWRT_VERSION"
          else
            OPENWRT_VERSION="$(
              curl --fail --location --retry 3 \
                'https://downloads.openwrt.org/.versions.json' \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["stable_version"])'
            )"

            if [[ -z "$OPENWRT_VERSION" ]]; then
              echo "Impossibile determinare l'ultima release stabile OpenWrt."
              exit 1
            fi
          fi

          if [[ ! "$CF_VERSION" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versione cloudflared non valida: $CF_VERSION"
            exit 1
          fi

          if [[ ! "$OPENWRT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versione OpenWrt non valida: $OPENWRT_VERSION"
            exit 1
          fi

          SHOULD_BUILD=true
          STATE_FILE="$RUNNER_TEMP/publication.json"
          rm -f "$STATE_FILE"
          if git ls-remote --exit-code --heads origin feed-state > "$RUNNER_TEMP/feed-ref"; then
            git fetch --depth=1 origin refs/heads/feed-state
            META="metadata/${OPENWRT_VERSION}/${PACKAGE_ARCH}.json"
            if git cat-file -e "FETCH_HEAD:$META" 2>/dev/null; then
              git show "FETCH_HEAD:$META" > "$STATE_FILE"
            fi
            git ls-tree -r --name-only FETCH_HEAD > "$RUNNER_TEMP/published-paths.txt"
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then exit "$status"; fi
            : > "$RUNNER_TEMP/published-paths.txt"
          fi
          PACKAGING_HASH="$(sha256sum .github/workflows/build.yml | awk '{print $1}')"
          PACKAGE_RELEASE="$(python3 - "$STATE_FILE" "$CF_VERSION" "$OPENWRT_VERSION" "$PACKAGE_ARCH" "$RUNNER_TEMP/published-paths.txt" <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          state_file, version, owrt, arch, paths_file = sys.argv[1:]
          state = json.loads(Path(state_file).read_text()) if Path(state_file).exists() else {}
          revisions = []
          if state.get("cloudflared_version") == version:
              revision = state.get("package_release", 1)
              if isinstance(revision, bool) or not str(revision).isdigit() or int(revision) < 1:
                  raise SystemExit("Revisione non valida nei metadati pubblicati")
              revisions.append(int(revision))
          pattern = re.compile(r"cloudflared-" + re.escape(version) + r"-r([1-9][0-9]*)\.apk")
          for path in Path(paths_file).read_text().splitlines():
              if path.startswith(f"releases/{owrt}/{arch}/"):
                  match = pattern.fullmatch(Path(path).name)
                  if match:
                      revisions.append(int(match[1]))
          tag = f"cloudflared-{version}-openwrt-{owrt}"
          result = subprocess.run(["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{tag}"], capture_output=True, text=True)
          if result.returncode:
              if "HTTP 404" not in result.stderr:
                  raise SystemExit(result.stderr)
          else:
              release = json.loads(result.stdout)
              for asset in release.get("assets", []):
                  match = pattern.fullmatch(asset["name"])
                  if match:
                      revisions.append(int(match[1]))
          print(max(revisions, default=0) + 1)
          PY
          )"
          [[ "$PACKAGE_RELEASE" =~ ^[1-9][0-9]*$ ]]
          echo "Versione richiesta: ${CF_VERSION}; OpenWrt: ${OPENWRT_VERSION}"
          echo "Nuova revisione: r${PACKAGE_RELEASE} (massimo già pubblicato + 1)"
          echo "cloudflared_version=$CF_VERSION" >> "$GITHUB_OUTPUT"
          echo "openwrt_version=$OPENWRT_VERSION" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "package_release=$PACKAGE_RELEASE" >> "$GITHUB_OUTPUT"
          echo "packaging_hash=$PACKAGING_HASH" >> "$GITHUB_OUTPUT"

  resolve-toolchain:
    needs: resolve-versions
    if: needs.resolve-versions.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    outputs:
      go_version: ${{ steps.go.outputs.go_version }}
      go_major_minor: ${{ steps.go.outputs.go_major_minor }}
      go_recipe_available: ${{ steps.go.outputs.go_recipe_available }}

    steps:
      - name: Resolve required Go version
        id: go
        shell: bash
        env:
          CF_VERSION: ${{ needs.resolve-versions.outputs.cloudflared_version }}
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/cloudflare/cloudflared/${CF_VERSION}/go.mod" \
            -o "$RUNNER_TEMP/cloudflared-go.mod"

          GO_VERSION="$(
            awk '$1 == "go" { print $2; exit }' \
              "$RUNNER_TEMP/cloudflared-go.mod"
          )"

          if [[ ! "$GO_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versione Go non valida in go.mod: $GO_VERSION"
            exit 1
          fi

          GO_MAJOR_MINOR="${GO_VERSION%.*}"

          GO_RELEASES="$(
            curl --fail --location --retry 3 \
              'https://go.dev/dl/?mode=json&include=all'
          )"

          GO_LATEST_PATCH="$(
            printf '%s' "$GO_RELEASES" \
              | python3 -c 'import json,sys; data=json.load(sys.stdin); series=sys.argv[1]; versions=[r["version"].removeprefix("go") for r in data if r.get("stable") and r["version"].removeprefix("go").startswith(series+".")]; print(max(versions, key=lambda value: tuple(map(int, value.split(".")))))' \
                "$GO_MAJOR_MINOR"
          )"

          GO_RECIPE_AVAILABLE=false
          if curl --fail --location --silent --retry 3 \
              "https://raw.githubusercontent.com/openwrt/packages/master/lang/golang/golang${GO_MAJOR_MINOR}/Makefile" \
              -o "$RUNNER_TEMP/go-recipe.mk"; then
            if grep -q '^PKG_NAME:=golang' "$RUNNER_TEMP/go-recipe.mk"; then
              GO_RECIPE_AVAILABLE=true
            fi
          fi

          echo "Requisito cloudflared: Go $GO_VERSION"
          echo "Serie Go richiesta: $GO_MAJOR_MINOR"
          echo "Ultima patch stabile: Go $GO_LATEST_PATCH"
          echo "Ricetta Go presente nel feed master: $GO_RECIPE_AVAILABLE"

          echo "go_version=$GO_LATEST_PATCH" >> "$GITHUB_OUTPUT"
          echo "go_major_minor=$GO_MAJOR_MINOR" >> "$GITHUB_OUTPUT"
          echo "go_recipe_available=$GO_RECIPE_AVAILABLE" >> "$GITHUB_OUTPUT"

  build:
    needs:
      - resolve-versions
      - resolve-toolchain
    if: needs.resolve-versions.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev \
            python3 python3-dev python3-setuptools python3-pyelftools \
            rsync unzip zlib1g-dev file wget curl zstd swig

          APK_VERSION="3.0.8-r0"
          APK_BASE="https://dl-cdn.alpinelinux.org/alpine/v3.23/main/x86_64"
          APK_FILE="apk-tools-static-${APK_VERSION}.apk"

          mkdir -p "$RUNNER_TEMP/apk-tools"
          cd "$RUNNER_TEMP/apk-tools"

          curl --fail --location --retry 3 \
            "$APK_BASE/$APK_FILE" \
            -o "$APK_FILE"

          tar -xzf "$APK_FILE" || true

          APK_STATIC="$(
            find . -type f \
              \( -name 'apk.static' -o -name 'apk' \) \
              -print \
              | head -n1
          )"

          test -n "$APK_STATIC"

          mkdir -p "$RUNNER_TEMP/bin"
          cp "$APK_STATIC" "$RUNNER_TEMP/bin/apk"
          chmod +x "$RUNNER_TEMP/bin/apk"

          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/bin/apk" --version

      - name: Download and verify OpenWrt SDK
        shell: bash
        env:
          OPENWRT_VERSION: ${{ needs.resolve-versions.outputs.openwrt_version }}
        run: |
          set -euo pipefail

          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}"

          mkdir -p "$RUNNER_TEMP/sdk-download"
          cd "$RUNNER_TEMP/sdk-download"

          curl --fail --location --retry 3 "$BASE/sha256sums" -o sha256sums

          SDK_FILE="$(
            awk '{print $2}' sha256sums \
              | sed 's/^\*//' \
              | grep -E "^openwrt-sdk-${OPENWRT_VERSION}-rockchip-armv8_.*Linux-x86_64\.tar\.(xz|zst)$"
          )"

          test -n "$SDK_FILE"
          test "$(printf '%s\n' "$SDK_FILE" | wc -l)" -eq 1

          curl --fail --location --retry 3 "$BASE/$SDK_FILE" -o "$SDK_FILE"

          sha256sum --check --ignore-missing sha256sums

          mkdir -p "$GITHUB_WORKSPACE/sdk"
          tar -xf "$SDK_FILE" -C "$GITHUB_WORKSPACE/sdk" --strip-components=1

      - name: Prepare OpenWrt feeds
        working-directory: sdk
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install cloudflared

          test -f feeds/packages/net/cloudflared/Makefile
          test -f feeds/packages/lang/golang/golang/Makefile

      - name: Import current Go infrastructure
        working-directory: sdk
        shell: bash
        run: |
          set -euo pipefail

          rm -rf feeds/packages/lang/golang

          git clone --depth 1 \
            https://github.com/openwrt/packages.git \
            "$RUNNER_TEMP/packages-master"

          rm -rf "$RUNNER_TEMP/packages-master/.git"

          cp -a "$RUNNER_TEMP/packages-master/lang/golang" \
            feeds/packages/lang/golang

          ./scripts/feeds update packages

      - name: Install required Go recipe
        working-directory: sdk
        env:
          GO_MAJOR_MINOR: ${{ needs.resolve-toolchain.outputs.go_major_minor }}
          GO_RECIPE_AVAILABLE: ${{ needs.resolve-toolchain.outputs.go_recipe_available }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GO_RECIPE_AVAILABLE" != "true" ]]; then
            echo "Errore: il feed OpenWrt packages master non contiene golang${GO_MAJOR_MINOR}."
            echo "Aggiornare il workflow o attendere l'aggiornamento del feed."
            exit 1
          fi

          test -f "feeds/packages/lang/golang/golang${GO_MAJOR_MINOR}/Makefile"

          ./scripts/feeds install -f "golang${GO_MAJOR_MINOR}"

          test -f "package/feeds/packages/golang${GO_MAJOR_MINOR}/Makefile"

          echo "Ricetta Go registrata:"
          grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE|PKG_HASH):=' \
            "package/feeds/packages/golang${GO_MAJOR_MINOR}/Makefile"

      - name: Update Go recipe
        working-directory: sdk
        env:
          GO_VERSION: ${{ needs.resolve-toolchain.outputs.go_version }}
          GO_MAJOR_MINOR: ${{ needs.resolve-toolchain.outputs.go_major_minor }}
        shell: bash
        run: |
          set -euo pipefail

          GO_RECIPE_FILE="feeds/packages/lang/golang/golang${GO_MAJOR_MINOR}/Makefile"
          GO_VALUES_FILE="feeds/packages/lang/golang/golang-values.mk"

          test -f "$GO_RECIPE_FILE"
          test -f "$GO_VALUES_FILE"

          GO_META_FILE="$RUNNER_TEMP/go-releases.json"

          curl --fail --location --retry 3 \
            'https://go.dev/dl/?mode=json&include=all' \
            -o "$GO_META_FILE"

          GO_HASH="$(
            python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); version=sys.argv[2]; print(next(f["sha256"] for r in data if r["version"]=="go"+version for f in r["files"] if f["filename"]=="go"+version+".src.tar.gz"))' \
              "$GO_META_FILE" "$GO_VERSION"
          )"

          test -n "$GO_HASH"

          GO_PATCH="${GO_VERSION##*.}"

          sed -i \
            -e "s/^GO_VERSION_PATCH:=.*/GO_VERSION_PATCH:=${GO_PATCH}/" \
            -e "s|^PKG_HASH:=.*|PKG_HASH:=${GO_HASH}|" \
            "$GO_RECIPE_FILE"

          sed -i \
            "s/^GO_DEFAULT_VERSION:=.*/GO_DEFAULT_VERSION:=${GO_MAJOR_MINOR}/" \
            "$GO_VALUES_FILE"

          echo "Ricetta Go aggiornata:"
          grep -E '^(GO_VERSION_MAJOR_MINOR|GO_VERSION_PATCH|GO_VERSION_RC|PKG_HASH):=' \
            "$GO_RECIPE_FILE"

          echo "Versione Go predefinita:"
          grep -n 'GO_DEFAULT_VERSION' "$GO_VALUES_FILE"

      - name: Update cloudflared recipe
        working-directory: sdk
        env:
          CF_VERSION: ${{ needs.resolve-versions.outputs.cloudflared_version }}
          PACKAGE_RELEASE: ${{ needs.resolve-versions.outputs.package_release }}
          GO_MAJOR_MINOR: ${{ needs.resolve-toolchain.outputs.go_major_minor }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \
            "https://codeload.github.com/cloudflare/cloudflared/tar.gz/${CF_VERSION}" \
            -o "$RUNNER_TEMP/cloudflared-source.tar.gz"

          CF_HASH="$(
            sha256sum "$RUNNER_TEMP/cloudflared-source.tar.gz" \
              | awk '{print $1}'
          )"

          sed -i \
            -e "s/^PKG_VERSION:=.*/PKG_VERSION:=${CF_VERSION}/" \
            -e "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${PACKAGE_RELEASE}/" \
            -e "s|^PKG_HASH:=.*|PKG_HASH:=${CF_HASH}|" \
            -e "s|^PKG_BUILD_DEPENDS:=.*|PKG_BUILD_DEPENDS:=golang${GO_MAJOR_MINOR}/host|" \
            feeds/packages/net/cloudflared/Makefile

          mkdir -p dl

          cp "$RUNNER_TEMP/cloudflared-source.tar.gz" \
            "dl/cloudflared-${CF_VERSION}.tar.gz"

          echo "Ricetta cloudflared aggiornata:"
          grep -E '^(PKG_VERSION|PKG_RELEASE|PKG_HASH|PKG_BUILD_DEPENDS):=' \
            feeds/packages/net/cloudflared/Makefile

          grep -qx "PKG_RELEASE:=${PACKAGE_RELEASE}" feeds/packages/net/cloudflared/Makefile
          [[ "$PACKAGE_RELEASE" =~ ^[1-9][0-9]*$ ]]

      - name: Inspect cloudflared packaging hooks
        working-directory: sdk
        shell: bash
        run: |
          set -euo pipefail

          RECIPE="feeds/packages/net/cloudflared/Makefile"

          echo "### Hook di packaging cloudflared"
          grep -nE '^(define Package/cloudflared/(postinst|prerm|conffiles)|\$\(eval \$\(call (GoBinPackage|BuildPackage)' "$RECIPE" || true

          if grep -q '^define Package/cloudflared/postinst' "$RECIPE"; then
            echo "Errore: la ricetta contiene già un postinst specifico."
            exit 1
          fi

      - name: Add restart-on-upgrade hook
        working-directory: sdk
        shell: bash
        run: |
          set -euo pipefail

          RECIPE="feeds/packages/net/cloudflared/Makefile"

          if grep -q '^define Package/cloudflared/postinst' "$RECIPE"; then
            echo "Errore: la ricetta contiene già un postinst specifico."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("feeds/packages/net/cloudflared/Makefile")
          text = path.read_text()
          marker = "$(eval $(call BuildPackage,cloudflared))"
          if text.count(marker) != 1:
              raise SystemExit("Impossibile individuare BuildPackage,cloudflared")

          hook = """define Package/cloudflared/postinst
          #!/bin/sh
          if [ -z "$${IPKG_INSTROOT}" ] && [ -x /etc/init.d/cloudflared ]; then
              if /etc/init.d/cloudflared status >/dev/null 2>&1; then
                  /etc/init.d/cloudflared restart || \
                      echo "cloudflared: riavvio fallito, controllare il servizio" >&2
              fi
          fi
          :

          endef

          """

          path.write_text(text.replace(marker, hook + marker))
          PY

          echo "Hook aggiunto alla ricetta:"
          grep -nA14 '^define Package/cloudflared/postinst' "$RECIPE"

      - name: Remove stale Go artifacts
        working-directory: sdk
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            build_dir/hostpkg \
            staging_dir/hostpkg \
            tmp/.host*

          mkdir -p build_dir/hostpkg staging_dir/hostpkg

      - name: Configure SDK
        working-directory: sdk
        shell: bash
        run: |
          set -euo pipefail

          touch .config

          sed -i -E \
            '/^(CONFIG_ALL|CONFIG_ALL_NONSHARED|CONFIG_ALL_KMODS|CONFIG_PACKAGE_cloudflared)=/d; /^# (CONFIG_ALL|CONFIG_ALL_NONSHARED|CONFIG_ALL_KMODS|CONFIG_PACKAGE_cloudflared) is not set$/d' \
            .config

          cat >> .config <<'EOF'
          # CONFIG_ALL is not set
          # CONFIG_ALL_NONSHARED is not set
          # CONFIG_ALL_KMODS is not set
          CONFIG_PACKAGE_cloudflared=m
          EOF

          make defconfig

          grep -qx 'CONFIG_PACKAGE_cloudflared=m' .config

      - name: Verify Go toolchain selection
        working-directory: sdk
        env:
          GO_VERSION: ${{ needs.resolve-toolchain.outputs.go_version }}
          GO_MAJOR_MINOR: ${{ needs.resolve-toolchain.outputs.go_major_minor }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Dipendenza dichiarata da cloudflared:"
          grep '^PKG_BUILD_DEPENDS:=' \
            feeds/packages/net/cloudflared/Makefile

          echo "Compilazione Go ${GO_VERSION} host:"
          make "package/golang${GO_MAJOR_MINOR}/host/compile" V=s

          GO_BIN="$(
            find "staging_dir/hostpkg/lib/go-${GO_MAJOR_MINOR}" \
              -type f \
              -path '*/bin/go' \
              -print \
              | head -n1
          )"

          test -n "$GO_BIN"

          echo "Go selezionato:"
          "$GO_BIN" version

          ACTUAL="$(
            "$GO_BIN" version \
              | sed -E 's/^go version go([0-9.]+).*/\1/'
          )"

          if [[ "$ACTUAL" != "$GO_VERSION" ]]; then
            echo "Errore: atteso Go ${GO_VERSION}, trovato $ACTUAL"
            exit 1
          fi

      - name: Build cloudflared
        working-directory: sdk
        shell: bash
        run: |
          set -euo pipefail

          make -j2 package/cloudflared/compile V=s

      - name: Restore previously published feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p feed
          if git ls-remote --exit-code --heads origin feed-state > "$RUNNER_TEMP/feed-ref"; then
            git fetch --depth=1 origin refs/heads/feed-state
            git archive FETCH_HEAD | tar -x -C feed
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then exit "$status"; fi
            echo "Primo avvio: nessun archivio feed-state disponibile."
          fi

      - name: Collect current package only
        shell: bash
        env:
          PACKAGE_RELEASE: ${{ needs.resolve-versions.outputs.package_release }}
          CF_VERSION: ${{ needs.resolve-versions.outputs.cloudflared_version }}
          OPENWRT_VERSION: ${{ needs.resolve-versions.outputs.openwrt_version }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_RELEASE" =~ ^[1-9][0-9]*$ ]]
          EXPECTED="cloudflared-${CF_VERSION}-r${PACKAGE_RELEASE}.apk"
          ROOT="sdk/bin/packages/${PACKAGE_ARCH}"
          echo "APK atteso: $EXPECTED"
          echo "APK prodotti:"
          find "$ROOT" -type f -name 'cloudflared-*.apk' -print
          mapfile -d '' -t MATCHES < <(find "$ROOT" -type f -name "$EXPECTED" -print0)
          if [[ ${#MATCHES[@]} -ne 1 ]]; then
            echo "Errore: atteso esattamente un APK $EXPECTED; trovati ${#MATCHES[@]}." >&2
            echo "Ricetta usata:"
            grep -E '^(PKG_VERSION|PKG_RELEASE):=' sdk/feeds/packages/net/cloudflared/Makefile
            exit 1
          fi
          FEED_DIR="feed/releases/${OPENWRT_VERSION}/${PACKAGE_ARCH}"
          rm -rf "$FEED_DIR"
          mkdir -p "$FEED_DIR"
          cp "${MATCHES[0]}" "$FEED_DIR/"

      - name: Create APK repository index
        working-directory: feed/releases/${{ needs.resolve-versions.outputs.openwrt_version }}/${{ env.PACKAGE_ARCH }}
        env:
          PACKAGE_RELEASE: ${{ needs.resolve-versions.outputs.package_release }}
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          APK_BIN="$RUNNER_TEMP/bin/apk"

          test -x "$APK_BIN"

          if [[ -z "$APK_SIGN_KEY" ]]; then
            echo "Errore: il secret APK_SIGN_KEY è vuoto."
            exit 1
          fi

          if [[ "$APK_SIGN_KEY" != *"BEGIN PRIVATE KEY"* ]]; then
            echo "Errore: APK_SIGN_KEY non sembra una chiave privata PKCS#8 PEM."
            exit 1
          fi

          echo "Pacchetti inclusi nell'indice:"
          find . -maxdepth 1 -type f -name '*.apk' -printf '%f\n'

          COUNT="$(
            find . -maxdepth 1 -type f -name '*.apk' | wc -l
          )"

          if [[ "$COUNT" -ne 1 ]]; then
            echo "Errore: l'indice deve contenere esattamente un pacchetto cloudflared."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/apk-keys"

          printf '%s\n' "$APK_SIGN_KEY" \
            > "$RUNNER_TEMP/apk-keys/owrt-cloudflared.key"

          chmod 600 "$RUNNER_TEMP/apk-keys/owrt-cloudflared.key"

          "$APK_BIN" mkndx \
            --allow-untrusted \
            --sign "$RUNNER_TEMP/apk-keys/owrt-cloudflared.key" \
            --output packages.adb \
            ./*.apk

          test -s packages.adb

          sha256sum ./*.apk packages.adb > sha256sums

      - name: Publish GitHub release
        shell: bash
        env:
          PACKAGE_RELEASE: ${{ needs.resolve-versions.outputs.package_release }}
          GH_TOKEN: ${{ github.token }}
          CF_VERSION: ${{ needs.resolve-versions.outputs.cloudflared_version }}
          OPENWRT_VERSION: ${{ needs.resolve-versions.outputs.openwrt_version }}
        run: |
          set -euo pipefail
          TAG="cloudflared-${CF_VERSION}-openwrt-${OPENWRT_VERSION}"
          APK_PATH="feed/releases/${OPENWRT_VERSION}/${PACKAGE_ARCH}/cloudflared-${CF_VERSION}-r${PACKAGE_RELEASE}.apk"
          test -f "$APK_PATH"
          if gh release view "$TAG" >/dev/null 2>"$RUNNER_TEMP/release-error"; then
            gh release upload "$TAG" "$APK_PATH"
          else
            if ! grep -qiE 'not found|404' "$RUNNER_TEMP/release-error"; then
              cat "$RUNNER_TEMP/release-error" >&2
              exit 1
            fi
            gh release create "$TAG" \
              --title "cloudflared ${CF_VERSION} per OpenWrt ${OPENWRT_VERSION}" \
              --notes "Pacchetto cloudflared ${CF_VERSION}-r${PACKAGE_RELEASE} per OpenWrt ${OPENWRT_VERSION} (rockchip/armv8, aarch64_generic)." \
              "$APK_PATH"
          fi

      - name: Copy public key to Pages feed
        shell: bash
        run: |
          set -euo pipefail

          test -f owrt-cloudflared.pem

          cp owrt-cloudflared.pem feed/owrt-cloudflared.pem

      - name: Prepare publication metadata
        shell: bash
        env:
          PACKAGING_HASH: ${{ needs.resolve-versions.outputs.packaging_hash }}
          PACKAGE_RELEASE: ${{ needs.resolve-versions.outputs.package_release }}
          CF_VERSION: ${{ needs.resolve-versions.outputs.cloudflared_version }}
          OPENWRT_VERSION: ${{ needs.resolve-versions.outputs.openwrt_version }}
        run: |
          set -euo pipefail
          mkdir -p "feed/metadata/${OPENWRT_VERSION}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = {"cloudflared_version": os.environ["CF_VERSION"],
                  "openwrt_version": os.environ["OPENWRT_VERSION"],
                  "package_release": int(os.environ["PACKAGE_RELEASE"]),
                  "packaging_hash": os.environ["PACKAGING_HASH"],
                  "target": os.environ["TARGET"], "package_arch": os.environ["PACKAGE_ARCH"]}
          path = Path("feed/metadata") / data["openwrt_version"] / (data["package_arch"] + ".json")
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Save feed snapshot for post-deploy persistence
        uses: actions/upload-artifact@v7
        with:
          name: feed-snapshot
          path: feed/
          retention-days: 7
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: feed

  deploy:
    needs: [resolve-versions, build]
    permissions:
      contents: write
      pages: write
      id-token: write
    if: needs.resolve-versions.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: feed
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Checkout repository for feed state
        uses: actions/checkout@v7
        with:
          path: feed-state-repo

      - name: Download deployed feed snapshot
        uses: actions/download-artifact@v8
        with:
          name: feed-snapshot
          path: ${{ runner.temp }}/published-feed

      - name: Persist state after successful Pages deploy
        working-directory: feed-state-repo
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin feed-state > "$RUNNER_TEMP/state-ref"; then
            git fetch --depth=1 origin refs/heads/feed-state
            git checkout -B feed-state FETCH_HEAD
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then exit "$status"; fi
            git checkout --orphan feed-state
            git rm -rf .
          fi
          rsync -a --delete --exclude='.git' "$RUNNER_TEMP/published-feed/" ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Persist deployed cloudflared feed"
            git push origin HEAD:refs/heads/feed-state
          fi

      - name: Remove superseded APK assets after successful deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CF_VERSION: ${{ needs.resolve-versions.outputs.cloudflared_version }}
          OPENWRT_VERSION: ${{ needs.resolve-versions.outputs.openwrt_version }}
          PACKAGE_RELEASE: ${{ needs.resolve-versions.outputs.package_release }}
        run: |
          set -euo pipefail

          TAG="cloudflared-${CF_VERSION}-openwrt-${OPENWRT_VERSION}"
          KEEP="cloudflared-${CF_VERSION}-r${PACKAGE_RELEASE}.apk"

          gh release view "$TAG" \
            --repo "$GH_REPO" \
            --json assets \
            --jq '.assets[].name' > "$RUNNER_TEMP/release-assets"

          while IFS= read -r ASSET; do
            if [[ "$ASSET" == "cloudflared-${CF_VERSION}-r"*.apk && "$ASSET" != "$KEEP" ]]; then
              echo "Rimuovo asset obsoleto: $ASSET"
              gh release delete-asset "$TAG" "$ASSET" \
                --repo "$GH_REPO" \
                --yes
            fi
          done < "$RUNNER_TEMP/release-assets"